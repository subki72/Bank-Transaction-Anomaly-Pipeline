name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and verify offline test gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/ -v --cov=src --cov-fail-under=75

      - name: Build release container image
        run: docker build -t bank-anomaly-pipeline:${{ github.ref_name }} .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
