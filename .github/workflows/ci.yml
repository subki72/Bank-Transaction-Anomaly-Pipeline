name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and typecheck tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 mypy

      - name: Run Ruff & Flake8 checks
        run: |
          python -m ruff check src tests main.py
          python -m ruff format --check src tests main.py
          python -m flake8 --max-line-length=120 src tests main.py

      - name: Run Mypy typecheck
        run: python -m mypy src --ignore-missing-imports

  test:
    name: Offline Test Suite & CLI Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage Gate (>=75%)
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=75

      - name: Verify CLI health and offline demo
        run: |
          python main.py --health
          python main.py --demo --rows 120 --seed 42

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t bank-anomaly-pipeline:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bank-anomaly-pipeline:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
